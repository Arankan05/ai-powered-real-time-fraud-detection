# ==============================================================================
# Alembic — Database Migration Configuration
# ==============================================================================
# The database URL is loaded from environment variables (POSTGRES_*) at
# runtime in env.py.  The placeholder below is intentionally left empty.
# ==============================================================================

[alembic]
script_location = alembic
version_path_separator = /
sqlalchemy.url =

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d-%%(rev)s-%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
