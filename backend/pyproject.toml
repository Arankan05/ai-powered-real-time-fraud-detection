[project]
name = "fraud-detection-backend"
version = "0.1.0"
description = "Backend API for the AI-Powered Financial Fraud Detection System"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
